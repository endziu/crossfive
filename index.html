<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cross Five</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { font-size: 100%; }
  @media (min-width: 900px) and (min-height: 760px) { html { font-size: 125%; } }

  body {
    background: #0a0a0c;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(0.75rem, env(safe-area-inset-top)) 0.5rem max(0.75rem, env(safe-area-inset-bottom));
    font-family: 'DM Mono', monospace;
    color: #e0ddd5;
    overflow: hidden;
    touch-action: manipulation;
  }

  h1 {
    font-weight: 300;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 0.75rem;
  }

  /* The board takes whatever space the header and controls leave; JS sizes the canvas to fit. */
  .board-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas { display: block; cursor: pointer; touch-action: none; }

  .status {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #444;
    height: 1.2em;
    transition: color 0.3s;
  }
  .status.active { color: #c4956a; }

  .info {
    margin-top: 0.5rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem 1.25rem;
    align-items: center;
  }

  .score {
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #777;
  }
  .score span { color: #c4956a; }

  button {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: none;
    border: 1px solid #333338;
    color: #888;
    padding: 0.55rem 0.9rem;
    cursor: pointer;
    transition: all 0.25s;
  }
  button:hover { border-color: #666; color: #ccc; }
  button.on { border-color: #c4956a; color: #c4956a; }

  @media (max-width: 480px) {
    h1 { font-size: 0.9rem; margin-bottom: 0.5rem; }
    .info { gap: 0.5rem 0.75rem; }
    button { padding: 0.6rem 0.7rem; letter-spacing: 0.12em; }
  }

  .help {
    margin-top: 1.2rem;
    font-size: 0.6rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: #333;
    text-align: center;
    line-height: 1.8;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0cee;
    z-index: 10;
    align-items: center;
    justify-content: center;
  }
  .overlay.visible { display: flex; }

  .modal {
    background: #111114;
    border: 1px solid #2a2a2e;
    padding: 2rem 2.5rem;
    max-width: 525px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
  }

  .modal h2 {
    font-weight: 300;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #c4956a;
    margin-bottom: 1.2rem;
  }

  .modal p {
    font-size: 0.7rem;
    font-weight: 300;
    color: #777;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
  }

  .modal img {
    max-width: 100%;
    border: 1px solid #2a2a2e;
    margin-bottom: 1rem;
  }

  .modal input[type="text"] {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    background: #0a0a0c;
    border: 1px solid #2a2a2e;
    color: #e0ddd5;
    padding: 0.5rem 0.8rem;
    width: 100%;
    outline: none;
    transition: border-color 0.25s;
    letter-spacing: 0.1em;
  }
  .modal input[type="text"]:focus { border-color: #c4956a; }

  .modal .btn-row {
    display: flex;
    gap: 0.8rem;
    justify-content: center;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }

  .modal a.dl-link {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: #c4956a;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 1.2rem;
  }
  .modal a.dl-link:hover { text-decoration: underline; }

  .lb-list {
    text-align: left;
    margin: 0.8rem 0;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
  }
  .lb-row {
    display: flex;
    padding: 0.4rem 0.6rem;
    color: #888;
  }
  .lb-row:nth-child(odd) { background: #0e0e11; }
  .lb-row .rank { width: 2rem; color: #555; }
  .lb-row .name { flex: 1; color: #c4956a; }
  .lb-row .lb-score { width: 3rem; text-align: right; color: #e0ddd5; }
  .lb-row .date { width: 5.5rem; text-align: right; color: #444; font-size: 0.55rem; }

  button:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<h1>Cross Five</h1>
<div class="board-wrap" id="boardWrap"><canvas id="board"></canvas></div>
<div class="status" id="status"></div>
<div class="info">
  <div class="score">lines <span id="scoreVal">0</span></div>
  <button id="hintBtn" aria-pressed="false">Hints</button>
  <button id="resetBtn">Reset</button>
  <button id="giveUpBtn">Give Up</button>
  <button id="lbBtn">Leaderboard</button>
</div>

<div class="overlay" id="gameOverOverlay">
  <div class="modal">
    <h2>Game Over</h2>
    <p>Final score: <span id="finalScore">0</span> lines</p>
    <img id="boardCapture" alt="Board screenshot">
    <a class="dl-link" id="saveImgLink" download="cross-five.png">Save Image</a>
    <div>
      <input type="text" id="nameInput" placeholder="Your name" maxlength="20">
    </div>
    <div class="btn-row">
      <button id="submitScoreBtn">Submit Score</button>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>
</div>

<div class="overlay" id="lbOverlay">
  <div class="modal">
    <h2>Leaderboard</h2>
    <div class="lb-list" id="lbList"></div>
    <div class="btn-row">
      <button id="closeLbBtn">Close</button>
    </div>
  </div>
</div>

<script>
const { canvas, ctx, statusEl, scoreEl } = {
  canvas: document.getElementById('board'),
  ctx: document.getElementById('board').getContext('2d'),
  statusEl: document.getElementById('status'),
  scoreEl: document.getElementById('scoreVal')
};

const SIZE = 20;
const CELL = 22;
const DOT_R = 3.6;
const POINT_R = 1.3;
const END_GAP = 6.5; // lines stop this far from their end dots, so where a line ends stays visible
const PAD = CELL * 0.7;
const SPAN = (SIZE - 1) * CELL;
const BOARD = SPAN + PAD * 2; // board size in game coordinates
const MAX_BOARD_CSS = 900;
const LINE_LEN = 5;

const COLOR = {
  bg: '#0a0a0c',
  point: '#3a3a41',
  line: 'rgba(224, 221, 213, 0.42)',
  accent: '#dca872',
  crossDot: '#8e8a82',
  playerDot: '#dca872',
};

const boardWrap = document.getElementById('boardWrap');
let scale = 1; // CSS pixels per game unit

// Fit the board into the space left by the header and controls, rendered at device resolution.
const resizeBoard = () => {
  const { width, height } = boardWrap.getBoundingClientRect();
  const css = Math.max(200, Math.floor(Math.min(width, height, MAX_BOARD_CSS)));
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = canvas.style.height = `${css}px`;
  canvas.width = canvas.height = Math.round(css * dpr);
  scale = css / BOARD;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  draw();
};

let grid = [];
let claimedLines = [];
let score = 0;
let hoverCell = null;
let statusTimeout = null;
let gameOver = false;
let sessionToken = null;
let pending = null;   // { r, c, lines } — placed dot awaiting the player's line choice
let hoverLine = null; // index into pending.lines under the pointer
let freeLines = null; // cache: claimable lines made only of existing dots (null = stale)
let hoverFree = null; // free line under the pointer
let lastDot = null;   // most recently placed dot, highlighted
let armed = null;     // touch: key of the action the first tap selected; a second tap confirms it
let showHints = false;
let moveCells = null; // cache: empty cells where a dot would complete a line (null = stale)

const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];

const CROSS = [
  [5, 8], [5, 11], [8, 11], [8, 14], [11, 14], [11, 11],
  [14, 11], [14, 8], [11, 8], [11, 5], [8, 5], [8, 8]
];

const CROSS_DOTS = (() => {
  const set = new Set();
  for (let i = 0; i < CROSS.length; i++) {
    const [r1, c1] = CROSS[i];
    const [r2, c2] = CROSS[(i + 1) % CROSS.length];
    const dr = Math.sign(r2 - r1);
    const dc = Math.sign(c2 - c1);
    let r = r1, c = c1;
    while (r !== r2 || c !== c2) {
      set.add(`${r},${c}`);
      r += dr; c += dc;
    }
  }
  return [...set].map(s => s.split(',').map(Number));
})();

const fetchSession = async () => {
  try {
    const res = await fetch('/api/session');
    if (!res.ok) throw new Error(`Session fetch failed: ${res.status}`);
    const data = await res.json();
    sessionToken = data.token;
  } catch (err) {
    sessionToken = null;
    console.error('Failed to fetch session token:', err);
    flash('Could not connect to server');
  }
};

const initGrid = () => {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  for (const [r, c] of CROSS_DOTS) grid[r][c] = 1;
  claimedLines = [];
  pending = null;
  hoverLine = null;
  freeLines = null;
  moveCells = null;
  hoverFree = null;
  lastDot = null;
  armed = null;
  score = 0;
  scoreEl.textContent = '0';
};

const px = (row, col) => [PAD + col * CELL, PAD + row * CELL];

const isDot = (r, c) => r >= 0 && r < SIZE && c >= 0 && c < SIZE && grid[r][c] > 0;

const lineKey = (cells) => cells.map(p => `${p.r},${p.c}`).join('|');

const linesConflict = (a, b) => {
  if (a.dr !== b.dr || a.dc !== b.dc) return false;
  let shared = 0;
  for (const p of a.cells) {
    for (const q of b.cells) {
      if (p.r === q.r && p.c === q.c) shared++;
    }
  }
  return shared >= 2;
};

// The 5-dot line starting at (sr, sc) in direction (dr, dc), if every cell is a dot
// and it is neither claimed nor in conflict with a claimed line; otherwise null.
const claimableLine = (sr, sc, dr, dc) => {
  const cells = [];
  for (let i = 0; i < LINE_LEN; i++) {
    const r = sr + i * dr;
    const c = sc + i * dc;
    if (!isDot(r, c)) return null;
    cells.push({ r, c });
  }
  const key = lineKey(cells);
  if (claimedLines.some(cl => lineKey(cl.cells) === key)) return null;
  const line = { cells, dr, dc };
  if (claimedLines.some(cl => linesConflict(line, cl))) return null;
  return line;
};

const findNewLines = (pr, pc) => {
  const found = [];
  for (const [dr, dc] of DIRS) {
    for (let offset = 0; offset < LINE_LEN; offset++) {
      const line = claimableLine(pr - offset * dr, pc - offset * dc, dr, dc);
      if (line) found.push(line);
    }
  }
  return found;
};

// Lines already fully formed by existing dots — claimable without placing a new dot.
const getFreeLines = () => {
  if (freeLines) return freeLines;
  freeLines = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      for (const [dr, dc] of DIRS) {
        const line = claimableLine(r, c, dr, dc);
        if (line) freeLines.push(line);
      }
    }
  }
  return freeLines;
};

const previewLines = (r, c) => {
  if (grid[r][c] !== 0) return [];
  grid[r][c] = 2;
  const result = findNewLines(r, c);
  grid[r][c] = 0;
  return result;
};

// Empty cells where placing a dot would complete at least one line.
const getMoveCells = () => {
  if (moveCells) return moveCells;
  moveCells = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0 && previewLines(r, c).length) moveCells.push({ r, c });
    }
  }
  return moveCells;
};

const lineEnds = (line) => [
  px(line.cells[0].r, line.cells[0].c),
  px(line.cells[LINE_LEN - 1].r, line.cells[LINE_LEN - 1].c)
];

// Lines are drawn END_GAP short of their end dots: a line touching a dot passes
// through it, a small gap means it ends there (so two collinear lines stay distinct).
const strokeLine = (line, color, width, dash = []) => {
  const [[x1, y1], [x2, y2]] = lineEnds(line);
  const len = Math.hypot(x2 - x1, y2 - y1);
  const ux = (x2 - x1) / len * END_GAP, uy = (y2 - y1) / len * END_GAP;
  ctx.beginPath(); ctx.moveTo(x1 + ux, y1 + uy); ctx.lineTo(x2 - ux, y2 - uy);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
};

const fillDot = (x, y, r, color) => {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
};

const ringDot = (x, y, r, color, width = 1) => {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
};

// Index of the line in `lines` closest to the pointer (within maxD), or null.
// Ties (collinear overlapping lines) go to the line whose midpoint is nearer,
// so pointing toward one end of a 6-in-a-row selects that end's line.
const nearestLine = (lines, { x, y }, maxD) => {
  let best = null, bestD = Infinity, bestM = Infinity;
  lines.forEach((line, i) => {
    const [[x1, y1], [x2, y2]] = lineEnds(line);
    const vx = x2 - x1, vy = y2 - y1;
    const t = Math.max(0, Math.min(1, ((x - x1) * vx + (y - y1) * vy) / (vx * vx + vy * vy)));
    const d = Math.hypot(x - x1 - t * vx, y - y1 - t * vy);
    const m = Math.hypot(x - (x1 + x2) / 2, y - (y1 + y2) / 2);
    if (d < bestD - 1 || (Math.abs(d - bestD) <= 1 && m < bestM)) {
      best = i; bestD = d; bestM = m;
    }
  });
  return bestD <= maxD ? best : null;
};

// Index of the pending candidate line under the pointer, or null.
const lineAt = (pos) => {
  const [dx, dy] = px(pending.r, pending.c);
  if (Math.hypot(pos.x - dx, pos.y - dy) < CELL * 0.45) return null; // every candidate passes through the dot
  return nearestLine(pending.lines, pos, CELL * 0.6);
};

// Free line under the pointer, or null. Empty cells take priority (they place a dot).
const freeLineAt = (pos) => {
  const cell = cellAt(pos);
  if (cell && grid[cell.r][cell.c] === 0) return null;
  const lines = getFreeLines();
  const i = nearestLine(lines, pos, CELL * 0.35);
  return i === null ? null : lines[i];
};

const draw = () => {
  ctx.fillStyle = COLOR.bg;
  ctx.fillRect(0, 0, BOARD, BOARD);

  const last = claimedLines[claimedLines.length - 1];
  for (const line of claimedLines) {
    if (line !== last) strokeLine(line, COLOR.line, 1.6);
  }
  if (last) strokeLine(last, COLOR.accent, 2);

  // Free lines (5 existing dots, claimable without a new dot) are hinted dashed.
  if (!pending && !gameOver) {
    for (const line of getFreeLines()) {
      if (line !== hoverFree) strokeLine(line, '#dca87299', 1.5, [2, 3]);
    }
  }

  let hoverPreview = [];
  if (pending) {
    pending.lines.forEach((line, i) => {
      if (i !== hoverLine) strokeLine(line, '#dca872aa', 1.6, [3, 3]);
    });
    if (hoverLine !== null) strokeLine(pending.lines[hoverLine], COLOR.accent, 2.6);
  } else if (hoverCell && grid[hoverCell.r][hoverCell.c] === 0) {
    hoverPreview = previewLines(hoverCell.r, hoverCell.c);
    for (const line of hoverPreview) strokeLine(line, '#dca872cc', 1.8, [3, 3]);
  } else if (hoverFree) {
    strokeLine(hoverFree, COLOR.accent, 2.6);
  }

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const [x, y] = px(r, c);
      const v = grid[r][c];
      if (v === 0) fillDot(x, y, POINT_R, COLOR.point);
      else fillDot(x, y, DOT_R, v === 2 ? COLOR.playerDot : COLOR.crossDot);
    }
  }

  if (showHints && !pending && !gameOver) {
    for (const { r, c } of getMoveCells()) {
      const [x, y] = px(r, c);
      ringDot(x, y, DOT_R, '#3f9a5070', 1);
      fillDot(x, y, POINT_R + 0.3, '#3f9a50a8');
    }
  }

  if (lastDot && !pending) {
    const [x, y] = px(lastDot.r, lastDot.c);
    ringDot(x, y, DOT_R + 2.2, COLOR.accent, 1);
  }

  if (pending) {
    const [x, y] = px(pending.r, pending.c);
    ringDot(x, y, DOT_R + 2.2, COLOR.accent, 1.2);
    fillDot(x, y, DOT_R, '#dca872aa');
  } else if (hoverCell && grid[hoverCell.r][hoverCell.c] === 0) {
    const [x, y] = px(hoverCell.r, hoverCell.c);
    const n = hoverPreview.length;
    ringDot(x, y, DOT_R + 2.2, n > 0 ? COLOR.accent : '#dca87255', 1);
    fillDot(x, y, DOT_R, n > 0 ? '#dca872aa' : '#dca87240');
  }
};

const pointerPos = (p) => {
  const rect = canvas.getBoundingClientRect();
  return { x: (p.clientX - rect.left) / scale, y: (p.clientY - rect.top) / scale };
};

const cellAt = ({ x, y }) => {
  const c = Math.round((x - PAD) / CELL);
  const r = Math.round((y - PAD) / CELL);
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return null;
  const [cx, cy] = px(r, c);
  return Math.hypot(x - cx, y - cy) <= CELL * 0.45 ? { r, c } : null;
};

const flash = (msg, sticky = false) => {
  statusEl.textContent = msg;
  statusEl.classList.add('active');
  clearTimeout(statusTimeout);
  if (sticky) return;
  statusTimeout = setTimeout(() => {
    statusEl.classList.remove('active');
    statusTimeout = setTimeout(() => statusEl.textContent = '', 300);
  }, 1500);
};

// Claim a line; `dot` is the newly placed dot, or null for a free line of existing dots.
const claimLine = (line, dot = null) => {
  if (dot) grid[dot.r][dot.c] = 2;
  lastDot = dot ? { r: dot.r, c: dot.c } : null;
  claimedLines.push(line);
  freeLines = null;
  moveCells = null;
  hoverFree = null;
  score++;
  scoreEl.textContent = score;
  const stuck = showHints && !getMoveCells().length && !getFreeLines().length;
  flash(stuck ? '+1 line · no moves left' : '+1 line');
};

const cancelPending = () => {
  pending = null;
  hoverLine = null;
  flash('Cancelled');
  draw();
};

// One placed dot = exactly one line. With several candidates the dot stays
// pending until the player picks a line (click near it) or cancels (click away / Esc).
const handleClick = (pos) => {
  if (gameOver) return;
  if (pending) {
    const i = lineAt(pos);
    if (i === null) return cancelPending();
    claimLine(pending.lines[i], pending);
    pending = null;
    hoverLine = null;
    draw();
    return;
  }
  const cell = cellAt(pos);
  if (!cell || grid[cell.r][cell.c] !== 0) {
    const free = freeLineAt(pos);
    if (free) { claimLine(free); draw(); }
    return;
  }
  const lines = previewLines(cell.r, cell.c);
  if (lines.length === 0) flash('No line');
  else if (lines.length === 1) claimLine(lines[0], cell);
  else {
    pending = { r: cell.r, c: cell.c, lines };
    hoverLine = null;
    flash(`Choose 1 of ${lines.length} lines`, true);
  }
  draw();
};

const updateHover = (pos) => {
  hoverCell = pos ? cellAt(pos) : null;
  hoverLine = pos && pending ? lineAt(pos) : null;
  hoverFree = pos && !pending && !gameOver ? freeLineAt(pos) : null;
  draw();
};

canvas.addEventListener('mousemove', e => updateHover(pointerPos(e)));
canvas.addEventListener('mouseleave', () => updateHover(null));
canvas.addEventListener('click', e => handleClick(pointerPos(e)));

// What a click at `pos` would do, as a comparable key (null = nothing).
const actionAt = (pos) => {
  if (gameOver) return null;
  if (pending) {
    const i = lineAt(pos);
    return i === null ? 'cancel' : `pick:${i}`;
  }
  const cell = cellAt(pos);
  if (cell && grid[cell.r][cell.c] === 0) {
    return previewLines(cell.r, cell.c).length ? `dot:${cell.r},${cell.c}` : 'noline';
  }
  const free = freeLineAt(pos);
  return free ? `free:${lineKey(free.cells)}` : null;
};

const ARM_HINT = { dot: 'Tap again to place', free: 'Tap again to claim', pick: 'Tap again to confirm' };

// Touch: a fingertip hides the point it is on and cells are small on phones, so the
// first tap only shows what would happen; tapping the same thing again does it.
const handleTap = (pos) => {
  const action = actionAt(pos);
  if (action === 'cancel' || action === 'noline' || (action && action === armed)) {
    armed = null;
    handleClick(pos);
    if (!pending) updateHover(null);
    return;
  }
  armed = action;
  updateHover(action ? pos : null);
  if (action) flash(ARM_HINT[action.split(':')[0]]);
};

canvas.addEventListener('touchstart', e => e.preventDefault());
canvas.addEventListener('touchmove', e => e.preventDefault());
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  handleTap(pointerPos(e.changedTouches[0]));
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pending && !gameOver) cancelPending();
  if ((e.key === 'h' || e.key === 'H') && !e.ctrlKey && !e.metaKey && !e.altKey && e.target.tagName !== 'INPUT') toggleHints();
});

const gameOverOverlay = document.getElementById('gameOverOverlay');
const lbOverlay = document.getElementById('lbOverlay');
const lbList = document.getElementById('lbList');
const nameInput = document.getElementById('nameInput');
const submitScoreBtn = document.getElementById('submitScoreBtn');
const boardCapture = document.getElementById('boardCapture');
const saveImgLink = document.getElementById('saveImgLink');
const finalScoreEl = document.getElementById('finalScore');

const resetGame = () => {
  gameOver = false;
  gameOverOverlay.classList.remove('visible');
  lbOverlay.classList.remove('visible');
  submitScoreBtn.disabled = false;
  nameInput.value = '';
  initGrid();
  fetchSession();
  flash('Board reset');
  draw();
};

const showGameOver = async () => {
  gameOver = true;
  hoverCell = null;
  pending = null;
  hoverLine = null;
  hoverFree = null;
  armed = null;
  draw();
  const dataUrl = canvas.toDataURL('image/png');
  boardCapture.src = dataUrl;
  saveImgLink.href = dataUrl;
  finalScoreEl.textContent = score;
  nameInput.value = '';

  const { ok, entries } = await fetchLeaderboard();
  const canSubmit = ok && (entries.length < 10 || score > entries[entries.length - 1].score);
  submitScoreBtn.disabled = !canSubmit;
  nameInput.disabled = !canSubmit;
  nameInput.placeholder = canSubmit ? 'Your name' : !ok ? 'Leaderboard unavailable' : 'Score too low';

  gameOverOverlay.classList.add('visible');
};

const submitScore = async (name) => {
  try {
    const res = await fetch('/api/leaderboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, score, token: sessionToken })
    });
    if (res.status === 409) { flash('Score too low for leaderboard'); submitScoreBtn.disabled = true; return; }
    if (!res.ok) throw new Error('Submit failed');
    gameOverOverlay.classList.remove('visible');
    await showLeaderboard();
  } catch {
    flash('Could not submit score');
    submitScoreBtn.disabled = false;
  }
};

const fetchLeaderboard = async () => {
  try {
    const res = await fetch('/api/leaderboard?limit=10');
    if (!res.ok) return { ok: false, entries: [] };
    return { ok: true, entries: await res.json() };
  } catch {
    return { ok: false, entries: [] };
  }
};

const escapeHtml = (str) => str
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

const showLeaderboard = async () => {
  lbList.innerHTML = '<p style="color:#555;font-size:0.6rem">Loading...</p>';
  lbOverlay.classList.add('visible');
  const { ok, entries } = await fetchLeaderboard();
  if (!ok) {
    lbList.innerHTML = '<p style="color:#555;font-size:0.6rem;letter-spacing:0.1em">Could not load leaderboard</p>';
    return;
  }
  if (entries.length === 0) {
    lbList.innerHTML = '<p style="color:#555;font-size:0.6rem;letter-spacing:0.1em">No scores yet</p>';
    return;
  }
  lbList.innerHTML = entries.map((e, i) => {
    const d = e.created_at ? escapeHtml(e.created_at.slice(0, 10)) : '';
    return `<div class="lb-row">
      <span class="rank">${i + 1}.</span>
      <span class="name">${escapeHtml(String(e.name))}</span>
      <span class="lb-score">${Number(e.score)}</span>
      <span class="date">${d}</span>
    </div>`;
  }).join('');
};

const hintBtn = document.getElementById('hintBtn');
const toggleHints = () => {
  showHints = !showHints;
  hintBtn.classList.toggle('on', showHints);
  hintBtn.setAttribute('aria-pressed', showHints);
  if (showHints && !gameOver && !getMoveCells().length && !getFreeLines().length) flash('No moves left');
  draw();
};
hintBtn.addEventListener('click', toggleHints);

document.getElementById('resetBtn').addEventListener('click', resetGame);

document.getElementById('giveUpBtn').addEventListener('click', () => {
  if (gameOver) return;
  showGameOver();
});

submitScoreBtn.addEventListener('click', () => {
  const name = nameInput.value.trim().slice(0, 20);
  if (!name) { nameInput.focus(); return; }
  submitScoreBtn.disabled = true;
  submitScore(name);
});

document.getElementById('playAgainBtn').addEventListener('click', resetGame);

document.getElementById('lbBtn').addEventListener('click', showLeaderboard);

document.getElementById('closeLbBtn').addEventListener('click', () => {
  lbOverlay.classList.remove('visible');
});

initGrid();
fetchSession();
new ResizeObserver(resizeBoard).observe(boardWrap);
resizeBoard();
</script>
</body>
</html>
